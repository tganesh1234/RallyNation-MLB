spring.application.name=rallynation-mlb

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rallynation}
spring.datasource.username=${DB_USERNAME:rallynation}
spring.datasource.password=${DB_PASSWORD:demo}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.issuer=${JWT_ISSUER:rallynation-mlb}
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:15m}
